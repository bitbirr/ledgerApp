<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Credit Debit – Financial Management</title>

    <!-- Basic SEO -->
    <meta name="description" content="Offline-first financial management app for tracking credit/debit accounts, invoices, and cash flow." />
    <meta name="theme-color" content="#1976D2" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- (Optional) Fonts – keep lightweight; Tailwind uses system fonts by default -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"> -->

    <!-- Prevent flash of wrong theme: apply 'dark' class ASAP based on saved/system preference -->
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch {}
      })();
    </script>

    <!-- Minimal critical styles (let Tailwind handle everything else) -->
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; }
      /* Loading spinner shown until React mounts */
      .loading-spinner {
        position: fixed; inset: 0; display: grid; place-items: center;
      }
      .loading-spinner::after {
        content: ""; width: 40px; height: 40px; border-radius: 9999px;
        border: 4px solid #1976D2; border-top-color: transparent;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* Hide spinner once app has rendered */
      #root:not(:empty) + .loading-spinner { display: none; }
    </style>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <div id="root"></div>
    <div class="loading-spinner" aria-label="Loading application"></div>

    <!-- Your app -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register SW only in non-localhost environments to avoid dev cache weirdness -->
    <script>
      (function () {
        const isLocal =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.hostname === '0.0.0.0';
        if ('serviceWorker' in navigator && !isLocal) {
          window.addEventListener('load', () => {
            navigator.serviceWorker
              .register('/sw.js', { scope: '/' })
              .then(reg => {
                // optional: update toast
                reg.addEventListener('updatefound', () => {
                  const nw = reg.installing;
                  nw && nw.addEventListener('statechange', () => {
                    if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('App update available.');
                    }
                  });
                });
              })
              .catch(err => console.log('SW registration failed:', err));
          });
        }
      })();
    </script>
  </body>
</html>
