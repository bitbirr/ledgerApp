    <!-- Critical CSS inlined for performance -->
    <style>
      /* Critical path CSS for initial render */
      :root {
        --primary: #1976D2;
        --primary-foreground: #FFFFFF;
        --background: #FAFAFA;
        --foreground: #1C1B1F;
      }
      
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #121212;
          --foreground: #E6E1E5;
        }
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      
      body {
        background-color: var(--background);
        color: var(--foreground);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        min-height: 100dvh;
      }
      
      /* Loading spinner */
      .loading-spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 48px;
        height: 48px;
        border: 4px solid var(--primary);
        border-top: 4px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        z-index: 9999;
      }
      
      @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
      }
      
      /* Hide loading spinner once app loads */
      #root:not(:empty) + .loading-spinner {
        display: none;
      }
      
      /* Safe area handling for mobile devices */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      
      /* Prevent overscroll bounce on iOS */
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      
      /* Focus styles for accessibility */
      :focus {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      
      /* High contrast mode support */
      @media (prefers-contrast: high) {
        :root {
          --primary: #0056CC;
        }
      }
      
      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

  <body>
    <!-- Main app container -->
    <div id="root"></div>
    
    <!-- Loading spinner fallback -->
    <div class="loading-spinner" aria-label="Loading application"></div>
    
    <!-- Offline indicator -->
    <div id="offline-indicator" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #f44336; color: white; padding: 8px; text-align: center; z-index: 10000; font-size: 14px;">
      You are currently offline. Some features may be limited.
    </div>
    
    <!-- Update available indicator -->
    <div id="update-indicator" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #4CAF50; color: white; padding: 8px; text-align: center; z-index: 10000; font-size: 14px; cursor: pointer;">
      App update available. Tap to refresh.
    </div>
    
    <!-- Main application script -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js', {
              scope: '/'
            });
            
            console.log('SW registered: ', registration);
            
            // Handle service worker updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New content is available
                    showUpdateIndicator();
                  }
                });
              }
            });
            
            // Handle messages from service worker
            navigator.serviceWorker.addEventListener('message', (event) => {
              if (event.data && event.data.type === 'UPDATE_AVAILABLE') {
                showUpdateIndicator();
              }
            });
            
          } catch (registrationError) {
            console.log('SW registration failed: ', registrationError);
          }
        });
      }
      
      // Handle online/offline status
      function updateOnlineStatus() {
        const indicator = document.getElementById('offline-indicator');
        if (indicator) {
          indicator.style.display = navigator.onLine ? 'none' : 'block';
        }
      }
      
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      
      // Show update indicator
      function showUpdateIndicator() {
        const indicator = document.getElementById('update-indicator');
        if (indicator) {
          indicator.style.display = 'block';
          indicator.addEventListener('click', () => {
            window.location.reload();
          });
        }
      }
      
      // Handle PWA install prompt
      let deferredPrompt;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        
        // You can show a custom install button here
        console.log('PWA install prompt available');
      });
      
      // Handle PWA installation
      window.addEventListener('appinstalled', () => {
        console.log('PWA was installed');
        deferredPrompt = null;
      });
      
      // Performance monitoring
      if ('web-vital' in window) {
        // Measure Core Web Vitals if library is available
        // This could be extended with analytics integration
      }
      
      // Initialize app theme from system preference or saved preference
      function initializeTheme() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      }
      
      // Initialize theme immediately to prevent flash
      initializeTheme();
      
      // Handle system theme changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
          if (e.matches) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }
      });
      
      // Error handling
      window.addEventListener('error', (event) => {
        console.error('Global error:', event.error);
        // Could send to analytics service
      });
      
      window.addEventListener('unhandledrejection', (event) => {
        console.error('Unhandled promise rejection:', event.reason);
        // Could send to analytics service
      });
    </script>
