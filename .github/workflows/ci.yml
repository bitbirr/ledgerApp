name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Prepare .env (dev defaults)
        run: |
          cp .env.example .env
          echo "NODE_ENV=development" >> .env

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: Upload artifact (dist)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  db-smoke:
    name: DB Smoke (internal pushes only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    # Only run when secrets are available (internal pushes)
    if: ${{ github.event_name == 'push' }}
    env:
      NODE_ENV: development
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Quick connectivity ping so we don't need to hit /api/dev/seed/full
      - name: DB connectivity check
        run: |
          node -e "const mysql=require('mysql2/promise');(async()=>{const c=await mysql.createConnection(process.env.DATABASE_URL);const [r]=await c.query('SELECT 1');console.log('DB OK', r[0]);await c.end();})();"
